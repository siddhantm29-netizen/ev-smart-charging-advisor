name: Scheduled Data Refresh

# Pulls the last 3 weeks of SMARD data (incremental merge, not a full
# re-fetch), re-cleans, regenerates the live 48h recommendation, and
# commits the result. Does NOT retrain the XGBoost/Prophet models —
# that's a deliberate manual step (python src/forecast.py --target ...).

on:
  schedule:
    - cron: "0 5 * * *"   # daily at 05:00 UTC
  workflow_dispatch:

# Cancel any in-progress run for the same branch before starting a new one.
# Prevents non-fast-forward push conflicts when the workflow is triggered
# manually while a scheduled run is already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh SMARD data (incremental, last 3 weeks merged into existing history)
        run: python src/data_fetch.py --smard --lookback-chunks 3 --merge

      - name: Clean data
        run: python src/clean_data.py --smard

      - name: Regenerate the live recommendation
        run: python src/recommend.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- data/raw data/processed recommendations
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Scheduled data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
